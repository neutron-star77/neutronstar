<!DOCTYPE html>
<html lang="zh-CN">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NeutronStar · 写作后台</title>
    <link rel="stylesheet" href="admin.css" />
    <style>
      body { margin: 0; background: #f5f5f4; }
    </style>
  </head>
  <body>
    <!-- Decap CMS 会自动加载同目录下的 /admin/config.yml -->
    <!-- 注意：版本必须钉死到确切版本（3.3.3）。用 ^3.3.3 这类范围 unpkg 会 404/解析不一致，

    <script src="https://unpkg.com/decap-cms@3.3.3/dist/decap-cms.js"></script>
  </body>
